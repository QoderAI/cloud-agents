name: Publish MCP Registry

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish ${{ matrix.region }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - region: Global
            server_json: mcp/qoder-cloud-agents/server.json
          - region: CN
            server_json: mcp/qoder-cloud-agents-cn/server.json

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        env:
          PUBLISHER_SHA256: 1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf
        run: |
          curl -L --fail \
            --output mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.0/mcp-publisher_linux_amd64.tar.gz
          echo "${PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check
          tar -xzf mcp-publisher.tar.gz mcp-publisher

      - name: Authenticate
        run: ./mcp-publisher login github-oidc

      - name: Validate
        run: ./mcp-publisher validate "${{ matrix.server_json }}"

      - name: Publish
        run: ./mcp-publisher publish "${{ matrix.server_json }}"
